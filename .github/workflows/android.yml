# 安卓 App：android/ 有改动推到 main 时自动编译，APK 放进 Actions 的产物，并发布成 GitHub Release「android-v<版本>」。
# ERP 的 设置 → 组件与插件 → 安卓 App 里「从 GitHub 取最新版」拿的就是这里发布的 APK。
# 版本号在 android/app/build.gradle.kts（versionName）；同一个版本再编译会更新那个发布里的 APK。
# 正式签名（可选）：在仓库 Settings → Secrets 里放 ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、
# ANDROID_KEY_PASSWORD；没放就用仓库里固定的 debug.keystore 签名（每次签名一样，手机上能直接覆盖安装）。
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu 机器自带 Android SDK（$ANDROID_HOME）：只补装需要的平台和编译工具
      # （不用 android-actions/setup-android：它找不到「tools」包时会直接失败）
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gradle wrapper (generate the jar if it is missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Read version
        id: ver
        run: |
          v=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "App version $v"

      - name: Release keystore from secrets (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the release keystore from secrets"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: release APK is signed with the repository debug.keystore"
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/3dops-${{ steps.ver.outputs.name }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/3dops-${{ steps.ver.outputs.name }}-debug.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: 3dops-android-${{ steps.ver.outputs.name }}
          path: android/out/*.apk

      - name: Publish GitHub release android-v${{ steps.ver.outputs.name }}
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.name }}
          name: Android App ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            3D Ops Android app ${{ steps.ver.outputs.name }} (commit ${{ github.sha }}).
            Install: open http://<NAS>:8790/apk on the phone after the boss fetched it in Settings → Components & plugins → Android App,
            or download 3dops-${{ steps.ver.outputs.name }}-release.apk below.
          files: android/out/*.apk
          fail_on_unmatched_files: true
